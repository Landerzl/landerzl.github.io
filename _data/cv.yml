      username: Landerzl
    - network: LinkedIn
      username: lander-zulueta

  sections:
    Education:
      - institution: University of the Basque Country (EHU)
        location: Leioa, Spain
        url: https://www.ehu.eus
        area: Physics
        studyType: B.Sc.
        start_date: 2022
        end_date: 2026
        score: "9.06/10"
        courses: "Quantum Mechanics, Thermodynamics, Statistical Mechanics, Electromagnetism, Solid State Physics, Advanced Laboratory Techniques"
        highlights:
          - "Grade: 9.06/10."
          - "Thesis: Critical Metrology (10/10, Honors)."

    Experience:
      - company: Qubiz.team
        position: Full-Time Researcher, Quantum Sensing
        location: Bilbao, Spain
        start_date: 2026-09
        end_date: present
        highlights:
          - Built and operate a fiber-based optical quantum sensing setup for magnetic field sensing.
          - Measured CW-ODMR (~1.5% contrast), pulsed Rabi oscillations and T1 relaxation.
          - Designed and simulated microwave waveguides for hyperpolarization setups with Ansys HFSS and COMSOL RF.

      - company: CIC nanoGUNE, Quantum Probe Microscopy Group
        position: Research Intern (Supervisor - Prof. Nacho Pascual)
        location: San Sebastián, Spain
        start_date: 2026-06
        end_date: 2026-08
        highlights:
          - Operated a low-temperature STM (LT-STM), including LHe/LN2 transfers and sub-Kelvin cryostats.
          - Characterized the transmission function of a cryogenic microwave antenna integrated into the STM junction, laying the RF calibration groundwork for ESR-STM measurements.
          - Prepared STM tips and Au(111) substrates (UHV annealing, sputtering, MBE) and synthesized graphene nanoribbons by on-surface synthesis, verified by STM topography.

      - company: University of the Basque Country (EHU)
        position: Undergraduate Researcher, Bachelor's Thesis (Supervisors - Iñigo Egusquiza, Jagoba Apellaniz; Ikasiker grant)
        location: Leioa, Spain
        start_date: 2025-09
        end_date: 2026-07
        highlights:
          - "Critical Metrology: can quantum metrology gain from operating near a quantum phase transition? Used the superradiant transition of the quantum Rabi model in the classical-oscillator limit, and showed that the precision of parameter estimation diverges at the critical point in the static limit."
          - Analytic work with Schrieffer-Wolff and bosonic Bogoliubov transformations; numerics with dense diagonalization and numerical differentiation.
          - "Code: github.com/Landerzl/Critical-Metrology"

      - company: Qubiz.team
        position: Researcher, Quantum Sensing
        location: Bilbao, Spain
        start_date: 2025-06
        end_date: 2025-12
        highlights:
          - Contributed to early-stage projects in biomedicine, automotive and electrical industries, studying quantum sensing devices.
          - Built RF components of a bench-top NMR device and tested classical machine-learning methods to enhance its signal.

