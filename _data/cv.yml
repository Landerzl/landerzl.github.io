cv:
  name: Lander Zulueta
  label: Physicist, quantum sensing
  email: lander.zulueta@gmail.com
  location: Leioa, Bizkaia, Spain
  image: ""
  summary: Physics graduate and full-time experimental researcher in quantum sensing at Qubiz.team, building and operating a fiber-based quantum magnetometer (CW-ODMR, pulsed Rabi, T1). Hands-on experience in microwave/RF engineering (waveguide design in HFSS and COMSOL, bench-top NMR), cryogenics and low-temperature STM at CIC nanoGUNE. Bachelor's thesis in quantum metrology.

  social_networks:
